<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>fancy-gol</title>
    <link rel="icon" href="data:," />
    <style>
      /*
       * P1-D-1's interim design tokens. `src/themes/` (P1-E-1) does not exist yet, so these live
       * here for now, scoped to exactly what the shell chrome consumes — not the full ADR-008
       * token contract (colour ramps, 6 type sizes, shadow scale, …), which is P1-E-1's own job
       * to enumerate. Every rule below this block reads a `var(--gol-*)`, never a literal colour
       * or size, so migrating these definitions into `src/themes/tokens.css` + the Default theme
       * module is a pure relocation with no consumer changes — the same "provisional now, real
       * token slots in with no API change" treatment `ui/overlay/grid-lines.ts`'s `FadeCurve` and
       * `ui/tools/select.ts`'s `marchPeriodMs` already got.
       */
      :root {
        color-scheme: dark;
        --gol-color-bg: #05070a;
        --gol-color-surface: rgba(5, 8, 11, 0.72);
        --gol-color-elevated: rgba(10, 15, 19, 0.85);
        --gol-color-border: rgba(124, 249, 208, 0.25);
        --gol-color-text: #d7f5e8;
        --gol-color-muted: #7ba396;
        --gol-color-accent: #7cf9d0;
        --gol-color-accent-strong: #9dfbdd;
        --gol-color-accent-pressed: #5ed6ae;
        --gol-color-on-accent: #05070a;
        --gol-color-scrim: rgba(0, 0, 0, 0.5);
        --gol-color-danger: #ff6b6b;
        --gol-color-danger-strong: #ff8a8a;
        --gol-color-syntax-key: var(--gol-color-accent);
        --gol-color-syntax-str: var(--gol-color-text);
        --gol-color-syntax-num: var(--gol-color-accent-strong);
        --gol-color-syntax-punct: var(--gol-color-muted);
        --gol-color-syntax-lit: var(--gol-color-accent-pressed);

        --gol-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --gol-font-size-xs: 11px;
        --gol-font-size-sm: 13px;
        --gol-font-size-xl: 22px;
        --gol-font-weight-regular: 400;
        --gol-font-weight-medium: 600;

        --gol-space-1: 4px;
        --gol-space-2: 8px;
        --gol-space-3: 12px;
        --gol-space-4: 16px;
        --gol-space-5: 24px;
        --gol-space-6: 32px;
        --gol-space-7: 48px;

        --gol-radius-sm: 6px;
        --gol-radius-md: 8px;

        --gol-shadow-chrome: 0 8px 24px rgba(0, 0, 0, 0.35);
        --gol-blur-chrome: blur(4px);

        /* Motion durations: provisional literals pending P1-E-1's real 4-duration scale. */
        --gol-duration-fast: 150ms;
        --gol-duration-slow: 600ms;
        --gol-ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1);

        /* Set per-region by `ui/components/shell.ts`'s `playIntro`; 0 the rest of the time. */
        --gol-intro-delay: 0ms;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--gol-color-bg);
      }

      /* The cascade's `origin` beats specificity: an author rule that sets `display` on a
       * `[hidden]` element (e.g. `.chrome-panel { display: flex }`) always wins over the UA
       * stylesheet's own `[hidden] { display: none }`, no matter how low its specificity —
       * caught live in a browser (P1-D-4's ruleset picker and migration dialog, both toggled via
       * the `hidden` property, rendered permanently open). This is the standard, narrow fix:
       * guarantee `hidden` always wins, for every element in this document, forever. */
      [hidden] {
        display: none !important;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      /* Scoped to the scene canvas specifically, not every `<canvas>` on the page — P1-D-4 added
       * 14 more (the ruleset picker's thumbnails), and a blanket `canvas { position: fixed;
       * inset: 0 }` rule pulled every one of them out of its flex layout and stretched it to
       * fill the viewport, caught live in a browser (`ruleset-picker.spec.ts`'s jsdom tests never
       * render real layout, so this had no way to fail there). */
      #scene {
        position: fixed;
        inset: 0;
        display: block;
      }

      /*
       * The chrome layer: full-viewport but pointer-transparent, so empty space between the
       * floating panels never steals a click/drag meant for the canvas underneath. Each region
       * re-enables pointer events for itself once it actually has content — `:empty` keeps an
       * unpopulated region (toolbar/panel-dock today; every future D-workstream task mounts into
       * one of these) invisible and inert instead of an awkward blank chip.
       */
      #chrome {
        position: fixed;
        inset: 0;
        pointer-events: none;
        transition: opacity var(--gol-duration-fast) var(--gol-ease-standard);
      }

      #chrome.chrome-hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Belt-and-braces: a region under an opacity-0 ancestor is still hit-testable by default
       * in some engines' accessibility trees; explicitly disabling pointer events on every region
       * too is what actually guarantees "canvas is never blocked by hidden chrome". */
      #chrome.chrome-hidden .chrome-region {
        pointer-events: none;
      }

      .chrome-region {
        position: absolute;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
        font: var(--gol-font-weight-regular) var(--gol-font-size-sm) / 1.4 var(--gol-font-mono);
        color: var(--gol-color-text);
        opacity: 1;
        transition:
          opacity var(--gol-duration-slow) var(--gol-ease-standard),
          transform var(--gol-duration-slow) var(--gol-ease-standard);
        transition-delay: var(--gol-intro-delay);
      }

      .chrome-region:empty {
        display: none;
      }

      #chrome.chrome-intro #chrome-toolbar,
      #chrome.chrome-intro #chrome-transport,
      #chrome.chrome-intro #chrome-status,
      #chrome.chrome-intro #chrome-panel-dock {
        opacity: 0;
        transform: translateY(6px);
      }
      #chrome.chrome-intro:not(.chrome-hidden) #chrome-toolbar,
      #chrome.chrome-intro:not(.chrome-hidden) #chrome-transport,
      #chrome.chrome-intro:not(.chrome-hidden) #chrome-status,
      #chrome.chrome-intro:not(.chrome-hidden) #chrome-panel-dock {
        opacity: 1;
        transform: translateY(0);
      }

      .chrome-panel {
        padding: var(--gol-space-2) var(--gol-space-3);
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
        background: var(--gol-color-surface);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-md);
        box-shadow: var(--gol-shadow-chrome);
        -webkit-backdrop-filter: var(--gol-blur-chrome);
        backdrop-filter: var(--gol-blur-chrome);
        user-select: none;
      }

      /* Solid fallback where `backdrop-filter` isn't supported (per-task requirement). */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .chrome-panel {
          background: var(--gol-color-elevated);
        }
      }

      #chrome-toolbar {
        left: var(--gol-space-3);
        top: 50%;
        transform: translateY(-50%);
      }
      #chrome.chrome-intro #chrome-toolbar {
        transform: translateY(calc(-50% + 6px));
      }
      #chrome.chrome-intro:not(.chrome-hidden) #chrome-toolbar {
        transform: translateY(-50%);
      }

      #chrome-transport {
        left: 50%;
        bottom: var(--gol-space-3);
        transform: translateX(-50%);
        align-items: center;
      }

      #chrome-status {
        right: var(--gol-space-3);
        bottom: var(--gol-space-3);
      }

      #chrome-panel-dock {
        right: 0;
        top: 0;
        bottom: 0;
        width: auto;
      }
      #chrome-panel-dock[data-dock='left'] {
        left: 0;
        right: auto;
      }
      #chrome-panel-dock[data-dock='right'] {
        right: 0;
        left: auto;
      }

      .panel-host {
        width: var(--gol-panel-width);
        min-width: var(--gol-panel-min-width);
        height: 100%;
        max-height: 100%;
        box-sizing: border-box;
      }
      .panel-host-collapsed {
        width: auto;
        min-width: 0;
      }
      .panel-host-rail {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--gol-space-2);
      }
      .panel-host-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gol-space-1);
      }
      .panel-host-tabs button[aria-selected='true'] {
        color: var(--gol-color-on-accent);
        background: var(--gol-color-accent);
      }
      .panel-host-frame {
        display: flex;
        flex: 1;
        min-height: 0;
        min-width: 0;
      }
      .panel-host-resize {
        flex: 0 0 var(--gol-space-2);
        cursor: ew-resize;
        align-self: stretch;
        background: var(--gol-color-border);
      }
      .panel-host-panel {
        flex: 1;
        min-width: var(--gol-panel-min-width);
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
      }
      .panel-host-title {
        margin: 0;
        font-size: var(--gol-font-size-sm);
        font-weight: var(--gol-font-weight-medium);
      }
      .panel-host-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        min-width: 0;
      }

      .stats-panel {
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-3);
        min-width: 0;
      }
      .stats-finding {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--gol-space-2);
        padding: var(--gol-space-2);
        background: var(--gol-color-elevated);
        border: 1px solid var(--gol-color-accent);
        border-radius: var(--gol-radius-sm);
      }
      .stats-finding-text {
        margin: 0;
        font-weight: var(--gol-font-weight-medium);
        color: var(--gol-color-accent-strong);
      }
      .stats-mode {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gol-space-1);
      }
      .stats-export {
        margin-left: auto;
      }
      .stats-mode button[aria-pressed='true'] {
        color: var(--gol-color-on-accent);
        background: var(--gol-color-accent);
      }
      .stats-heroes {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--gol-space-2);
      }
      .stats-hero {
        margin: 0;
      }
      .stats-hero-label {
        margin: 0;
        color: var(--gol-color-muted);
        font-size: var(--gol-font-size-xs);
      }
      .stats-hero-value {
        margin: 0;
        font-size: var(--gol-font-size-xl);
        font-weight: var(--gol-font-weight-medium);
        font-variant-numeric: tabular-nums;
      }
      .stats-spark,
      .stats-chart {
        width: 100%;
        height: calc(var(--gol-space-4) * 3);
        display: block;
      }
      .stats-chart {
        height: calc(var(--gol-space-4) * 8);
      }
      .stats-report {
        margin: 0;
      }
      .stats-window-label {
        margin: 0;
        color: var(--gol-color-muted);
        font-size: var(--gol-font-size-xs);
      }
      .stats-metrics {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: var(--gol-space-1) var(--gol-space-3);
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .stats-metrics dt {
        margin: 0;
        color: var(--gol-color-muted);
      }
      .stats-metrics dd {
        margin: 0;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: var(--gol-space-4);
        font-variant-numeric: tabular-nums;
      }
      .row .label {
        color: var(--gol-color-muted);
      }

      .controls {
        display: flex;
        gap: var(--gol-space-2);
      }
      .controls button {
        flex: 1;
        font: inherit;
        color: var(--gol-color-on-accent);
        background: var(--gol-color-accent);
        border: none;
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-2) var(--gol-space-3);
        cursor: pointer;
      }
      .controls button:hover {
        background: var(--gol-color-accent-strong);
      }
      .controls button:active {
        background: var(--gol-color-accent-pressed);
      }
      .controls button:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .controls button:disabled {
        background: var(--gol-color-elevated);
        color: var(--gol-color-muted);
        cursor: not-allowed;
      }
      .controls button[aria-pressed='true'] {
        background: var(--gol-color-accent-pressed);
      }

      /*
       * The speed control (P1-D-2): a logarithmic slider plus an "unbounded" toggle, stacked
       * under the transport buttons in the same `.chrome-panel`-shaped `#chrome-transport` mount
       * point. `accent-color` is a one-line, zero-JS way to recolour the *native* range/checkbox
       * rendering from a token — the cheap end of "Stay Fancy", not a bespoke slider skin.
       */
      .speed-control {
        min-width: 220px;
      }
      .speed-readout {
        font-variant-numeric: tabular-nums;
      }
      .speed-slider-row {
        display: flex;
        align-items: center;
        gap: var(--gol-space-2);
      }
      .speed-slider {
        flex: 1;
        accent-color: var(--gol-color-accent);
      }
      .speed-slider:disabled {
        accent-color: var(--gol-color-muted);
        opacity: 0.5;
      }
      .speed-unbounded {
        font: inherit;
        color: var(--gol-color-text);
        background: transparent;
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-1) var(--gol-space-2);
        cursor: pointer;
        line-height: 1;
      }
      .speed-unbounded:hover {
        border-color: var(--gol-color-accent);
      }
      .speed-unbounded[aria-pressed='true'] {
        background: var(--gol-color-accent);
        color: var(--gol-color-on-accent);
        border-color: var(--gol-color-accent);
      }
      .speed-unbounded:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }

      /*
       * The status bar (P1-D-3). `.status-value` reserves a minimum column width so a digit
       * count changing (population climbing from 9 to 10, say) doesn't nudge the label beside it
       * — "no layout shift as digit counts change" — `.row` already sets tabular-nums for every
       * digit's own width to match; this is the column-width half of that guarantee.
       */
      .status-bar {
        min-width: 200px;
      }
      .status-value {
        display: inline-block;
        min-width: 7ch;
        text-align: right;
      }
      .status-chips {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gol-space-1);
      }
      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: var(--gol-space-1);
        padding: 0 var(--gol-space-1);
        border-radius: var(--gol-radius-sm);
        border: 1px solid var(--gol-color-border);
      }
      .status-chip-swatch {
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        background: var(--gol-chip-color, var(--gol-color-muted));
        flex: none;
      }
      .status-chip-name {
        color: var(--gol-color-muted);
      }
      .status-chip .status-value {
        min-width: 2ch;
      }

      /*
       * The ruleset picker (P1-D-4): a toolbar toggle button opening a popover listbox, plus
       * (P1-D-5) a migration dialog for an incompatible palette switch, built on the shared
       * `.dialog-*` classes below. `.ruleset-popover` gets an explicit z-index because it's a
       * descendant of the *first* chrome region in DOM order (`#chrome-toolbar`) and must still
       * paint above the later regions (transport, status, panel dock) that would otherwise stack
       * on top per plain DOM order.
       */
      .ruleset-picker {
        position: relative;
      }
      .ruleset-toggle {
        font: inherit;
        color: var(--gol-color-text);
        background: var(--gol-color-surface);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-2) var(--gol-space-3);
        cursor: pointer;
        white-space: nowrap;
      }
      .ruleset-toggle:hover {
        border-color: var(--gol-color-accent);
      }
      .ruleset-toggle:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .ruleset-toggle-name {
        font-weight: var(--gol-font-weight-medium);
      }
      .ruleset-popover {
        position: absolute;
        left: calc(100% + var(--gol-space-2));
        top: 50%;
        transform: translateY(-50%);
        width: 340px;
        max-height: min(70vh, 520px);
        overflow-y: auto;
        z-index: 20;
        padding: var(--gol-space-2);
      }
      .ruleset-listbox:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: -2px;
      }
      .ruleset-group-title {
        margin: var(--gol-space-2) 0 var(--gol-space-1);
        font-size: var(--gol-font-size-sm);
        font-weight: var(--gol-font-weight-medium);
        color: var(--gol-color-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .ruleset-group:first-child .ruleset-group-title {
        margin-top: 0;
      }
      .ruleset-entry {
        display: flex;
        align-items: center;
        gap: var(--gol-space-2);
        padding: var(--gol-space-1) var(--gol-space-2);
        border-radius: var(--gol-radius-sm);
        cursor: pointer;
      }
      .ruleset-entry:hover,
      .ruleset-entry--highlighted {
        background: var(--gol-color-elevated);
      }
      .ruleset-entry[aria-selected='true'] {
        outline: 1px solid var(--gol-color-accent);
      }
      .ruleset-thumb {
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: var(--gol-radius-sm);
        background: var(--gol-color-bg);
      }
      .ruleset-entry-info {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .ruleset-entry-name {
        font-weight: var(--gol-font-weight-medium);
      }
      .ruleset-entry-meta {
        font-size: var(--gol-font-size-sm);
        color: var(--gol-color-muted);
      }
      .ruleset-entry-desc {
        font-size: var(--gol-font-size-sm);
        color: var(--gol-color-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ruleset-migration-hint {
        margin: 0;
        color: var(--gol-color-muted);
        font-size: var(--gol-font-size-sm);
      }
      .ruleset-migration-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--gol-space-2);
      }
      .ruleset-migration-row select {
        font: inherit;
      }

      /*
       * P2-B-4's interim library picker (the virtualised panel is P2-B-3, blocked on the
       * panel host). Same popover geometry as the ruleset picker so the two sit as a pair
       * in the toolbar. Origin badges are how user-saved patterns read as "yours".
       */
      .pattern-picker {
        position: relative;
      }
      .pattern-toggle {
        font: inherit;
        color: var(--gol-color-text);
        background: var(--gol-color-surface);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-2) var(--gol-space-3);
        cursor: pointer;
        white-space: nowrap;
      }
      .pattern-toggle:hover {
        border-color: var(--gol-color-accent);
      }
      .pattern-toggle:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .pattern-toggle-name {
        font-weight: var(--gol-font-weight-medium);
      }
      .pattern-popover {
        position: absolute;
        left: calc(100% + var(--gol-space-2));
        top: 50%;
        transform: translateY(-50%);
        width: 320px;
        max-height: min(70vh, 480px);
        overflow-y: auto;
        z-index: 20;
        padding: var(--gol-space-2);
      }
      .pattern-offline-hint {
        margin: 0 0 var(--gol-space-2);
        font-size: var(--gol-font-size-sm);
        color: var(--gol-color-muted);
      }
      .pattern-listbox:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: -2px;
      }
      .pattern-group-title {
        margin: var(--gol-space-2) 0 var(--gol-space-1);
        font-size: var(--gol-font-size-sm);
        font-weight: var(--gol-font-weight-medium);
        color: var(--gol-color-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .pattern-group-title:first-child {
        margin-top: 0;
      }
      .pattern-entry {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--gol-space-2);
        padding: var(--gol-space-1) var(--gol-space-2);
        border-radius: var(--gol-radius-sm);
        cursor: pointer;
      }
      .pattern-entry:hover,
      .pattern-entry--highlighted {
        background: var(--gol-color-elevated);
      }
      .pattern-entry[aria-selected='true'] {
        outline: 1px solid var(--gol-color-accent);
      }
      .pattern-entry-name {
        font-weight: var(--gol-font-weight-medium);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pattern-origin {
        flex: none;
        font-size: var(--gol-font-size-sm);
        color: var(--gol-color-muted);
        letter-spacing: 0.04em;
        text-transform: lowercase;
      }
      .pattern-origin--user {
        color: var(--gol-color-accent);
      }

      .lib-panel {
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
        min-height: 0;
        flex: 1;
      }
      .lib-offline {
        margin: 0;
        color: var(--gol-color-muted);
        font-size: var(--gol-font-size-sm);
      }
      .lib-toolbar {
        display: flex;
        gap: var(--gol-space-2);
      }
      .lib-search {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: var(--gol-color-text);
        background: var(--gol-color-elevated);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-1) var(--gol-space-2);
      }
      .lib-search:focus-visible,
      .lib-filters select:focus-visible,
      .lib-credits-btn:focus-visible,
      .lib-card:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .lib-credits-btn,
      .lib-detail-actions button {
        font: inherit;
        color: var(--gol-color-on-accent);
        background: var(--gol-color-accent);
        border: none;
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-1) var(--gol-space-2);
        cursor: pointer;
      }
      .lib-filters {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--gol-space-1);
      }
      .lib-filters select {
        font: inherit;
        color: var(--gol-color-text);
        background: var(--gol-color-elevated);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-1);
      }
      .lib-count {
        margin: 0;
        color: var(--gol-color-muted);
        font-size: var(--gol-font-size-xs);
      }
      .lib-virtual {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .lib-virtual-viewport {
        flex: 1;
        min-height: calc(var(--gol-space-7) * 4);
        overflow: auto;
        position: relative;
      }
      .lib-virtual-spacer {
        position: relative;
      }
      .lib-virtual-slice {
        will-change: transform;
      }
      .lib-card {
        display: flex;
        gap: var(--gol-space-2);
        align-items: center;
        height: calc(var(--gol-space-7) + var(--gol-space-6));
        padding: var(--gol-space-1) var(--gol-space-2);
        border-radius: var(--gol-radius-sm);
        cursor: grab;
      }
      .lib-card:hover,
      .lib-card--selected {
        background: var(--gol-color-elevated);
      }
      .lib-card--selected {
        outline: 1px solid var(--gol-color-accent);
      }
      .lib-thumb {
        width: calc(var(--gol-space-7) + var(--gol-space-4));
        height: calc(var(--gol-space-7) + var(--gol-space-4));
        flex: none;
        object-fit: contain;
        background: var(--gol-color-bg);
        border-radius: var(--gol-radius-sm);
        image-rendering: pixelated;
      }
      .lib-thumb--empty {
        background: var(--gol-color-elevated);
      }
      .lib-thumb--live {
        box-shadow: 0 0 0 1px var(--gol-color-accent);
      }
      .lib-card-body {
        min-width: 0;
        flex: 1;
      }
      .lib-card-name {
        margin: 0;
        font-weight: var(--gol-font-weight-medium);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lib-mark {
        color: var(--gol-color-on-accent);
        background: var(--gol-color-accent);
        border-radius: var(--gol-radius-sm);
      }
      .lib-card-attr,
      .lib-card-chips {
        margin: 0;
        color: var(--gol-color-muted);
        font-size: var(--gol-font-size-xs);
      }
      .lib-card-chips {
        display: flex;
        gap: var(--gol-space-2);
      }
      .lib-origin--user,
      .lib-chip {
        color: var(--gol-color-accent);
      }
      .lib-detail {
        border-top: 1px solid var(--gol-color-border);
        padding-top: var(--gol-space-2);
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-1);
      }
      .lib-detail-title {
        margin: 0;
        font-size: var(--gol-font-size-sm);
      }
      .lib-detail-attr,
      .lib-detail-meta,
      .lib-detail-desc {
        margin: 0;
        font-size: var(--gol-font-size-sm);
      }
      .lib-detail-attr {
        color: var(--gol-color-accent-strong);
      }
      .lib-detail-meta,
      .lib-detail-desc {
        color: var(--gol-color-muted);
      }
      .lib-detail-source {
        color: var(--gol-color-accent);
        font-size: var(--gol-font-size-xs);
        overflow-wrap: anywhere;
      }
      .lib-detail-actions {
        display: flex;
        gap: var(--gol-space-2);
      }
      .lib-credits-intro,
      .lib-credits-list {
        margin: 0;
        font-size: var(--gol-font-size-sm);
      }
      .lib-credits-list {
        padding-left: var(--gol-space-4);
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-3);
      }
      .lib-credits-list p {
        margin: var(--gol-space-1) 0 0;
        color: var(--gol-color-muted);
      }

      /*
       * Ruleset Studio (P2-E-1): overlay editor — transparent textarea over a highlighted
       * <pre>, virtualised gutter, hints parked on the offending line.
       */
      .studio-panel {
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
        min-height: 0;
        flex: 1;
      }
      .studio-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--gol-space-2);
      }
      .studio-badge {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: var(--gol-font-size-xl);
        font-weight: var(--gol-font-weight-medium);
        color: var(--gol-color-accent-strong);
        letter-spacing: 0.04em;
      }
      .studio-status {
        margin: 0;
        color: var(--gol-color-muted);
        font-size: var(--gol-font-size-xs);
      }
      .studio-form {
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
        min-width: 0;
      }
      .studio-notation-row label,
      .studio-hood label {
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-1);
        font-size: var(--gol-font-size-xs);
        color: var(--gol-color-muted);
      }
      .studio-notation,
      .studio-hood select,
      .studio-state-name,
      .studio-state select {
        font: inherit;
        color: var(--gol-color-text);
        background: var(--gol-color-elevated);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-1) var(--gol-space-2);
      }
      .studio-notation {
        font-size: var(--gol-font-size-xl);
        font-weight: var(--gol-font-weight-medium);
        letter-spacing: 0.04em;
        color: var(--gol-color-accent-strong);
      }
      .studio-temper {
        margin: 0;
        font-size: var(--gol-font-size-sm);
        color: var(--gol-color-accent);
      }
      .studio-chips {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gol-space-1);
      }
      .studio-chip,
      .studio-cell,
      .studio-random-btn,
      .studio-state-add,
      .studio-state-remove {
        font: inherit;
        color: var(--gol-color-text);
        background: var(--gol-color-elevated);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-1) var(--gol-space-2);
        cursor: pointer;
      }
      .studio-chip[aria-pressed='true'],
      .studio-cell[aria-pressed='true'],
      .studio-random-btn {
        color: var(--gol-color-on-accent);
        background: var(--gol-color-accent);
        border-color: var(--gol-color-accent);
      }
      .studio-table-wrap {
        overflow-x: auto;
      }
      .studio-table {
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .studio-table th,
      .studio-table td {
        padding: 0;
        text-align: center;
      }
      .studio-table th {
        font-size: var(--gol-font-size-xs);
        color: var(--gol-color-muted);
        font-weight: var(--gol-font-weight-regular);
        padding: var(--gol-space-1);
      }
      .studio-hood {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gol-space-3);
        align-items: flex-start;
      }
      .studio-diagrams {
        display: flex;
        gap: var(--gol-space-3);
      }
      .studio-diagram {
        margin: 0;
      }
      .studio-diagram figcaption {
        font-size: var(--gol-font-size-xs);
        color: var(--gol-color-muted);
      }
      .studio-diagram-grid {
        display: grid;
        gap: var(--gol-space-1);
      }
      .studio-diagram-cell {
        width: var(--gol-space-3);
        height: var(--gol-space-3);
        border-radius: var(--gol-radius-sm);
        background: var(--gol-color-elevated);
        display: grid;
        place-items: center;
        font-size: var(--gol-font-size-xs);
      }
      .studio-diagram-nb {
        background: var(--gol-color-accent);
      }
      .studio-diagram-center {
        background: var(--gol-color-accent-strong);
        color: var(--gol-color-on-accent);
      }
      .studio-states-title {
        margin: 0;
        font-size: var(--gol-font-size-xs);
        color: var(--gol-color-muted);
      }
      .studio-state {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gol-space-1);
        align-items: center;
      }
      .studio-state-color {
        width: var(--gol-space-4);
        height: var(--gol-space-4);
        padding: 0;
        border: 1px solid var(--gol-color-border);
        background: transparent;
        cursor: pointer;
      }
      .studio-state-alive {
        display: flex;
        align-items: center;
        gap: var(--gol-space-1);
        font-size: var(--gol-font-size-sm);
      }
      .studio-random {
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
      }
      .studio-sliders {
        display: grid;
        gap: var(--gol-space-1);
      }
      .studio-slider {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: var(--gol-space-2);
        align-items: center;
        font-size: var(--gol-font-size-xs);
        color: var(--gol-color-muted);
      }
      .studio-slider input {
        accent-color: var(--gol-color-accent);
      }
      .studio-chip:focus-visible,
      .studio-cell:focus-visible,
      .studio-notation:focus-visible,
      .studio-random-btn:focus-visible,
      .studio-state-add:focus-visible,
      .studio-state-remove:focus-visible,
      .studio-hood select:focus-visible,
      .studio-state-name:focus-visible,
      .studio-state select:focus-visible,
      .studio-state-color:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .studio-reset {
        display: flex;
        align-items: center;
        gap: var(--gol-space-1);
        font-size: var(--gol-font-size-sm);
        color: var(--gol-color-text);
        cursor: pointer;
      }
      .studio-apply {
        font: inherit;
        color: var(--gol-color-on-accent);
        background: var(--gol-color-accent);
        border: none;
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-1) var(--gol-space-3);
        cursor: pointer;
      }
      .studio-apply:disabled {
        background: var(--gol-color-elevated);
        color: var(--gol-color-muted);
        cursor: not-allowed;
      }
      .studio-apply:focus-visible,
      .studio-reset:focus-within,
      .studio-input:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .studio-editor {
        position: relative;
        display: flex;
        flex: 1;
        min-height: calc(var(--gol-space-7) * 6);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        background: var(--gol-color-elevated);
        overflow: hidden;
        font: var(--gol-font-weight-regular) var(--gol-font-size-sm) / 1.5 var(--gol-font-mono);
      }
      .studio-gutter {
        flex: 0 0 calc(var(--gol-space-6) + var(--gol-space-3));
        overflow: hidden;
        background: var(--gol-color-surface);
        border-right: 1px solid var(--gol-color-border);
        color: var(--gol-color-muted);
        user-select: none;
      }
      .studio-gutter-inner {
        will-change: transform;
      }
      .studio-gutter-line {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--gol-space-1);
        padding: 0 var(--gol-space-1);
        box-sizing: border-box;
      }
      .studio-gutter-num {
        font-variant-numeric: tabular-nums;
      }
      .studio-gutter-err {
        color: var(--gol-color-danger);
        background: var(--gol-color-surface);
      }
      .studio-gutter-mark {
        font-weight: var(--gol-font-weight-medium);
        color: var(--gol-color-danger-strong);
      }
      .studio-stack {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .studio-highlight,
      .studio-input {
        margin: 0;
        padding: var(--gol-space-2);
        border: 0;
        font: inherit;
        line-height: inherit;
        white-space: pre;
        tab-size: 2;
        word-wrap: normal;
        overflow-wrap: normal;
      }
      .studio-highlight {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        color: var(--gol-color-text);
      }
      .studio-highlight-inner {
        will-change: transform;
      }
      .studio-input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        resize: none;
        color: transparent;
        caret-color: var(--gol-color-accent);
        background: transparent;
        overflow: auto;
        z-index: 1;
      }
      .studio-hints {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 2;
      }
      .studio-hint {
        position: absolute;
        right: var(--gol-space-2);
        max-width: 60%;
        padding: 0 var(--gol-space-1);
        color: var(--gol-color-danger-strong);
        background: var(--gol-color-surface);
        border-radius: var(--gol-radius-sm);
        font-size: var(--gol-font-size-xs);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .studio-tok-key {
        color: var(--gol-color-syntax-key);
      }
      .studio-tok-str {
        color: var(--gol-color-syntax-str);
      }
      .studio-tok-num {
        color: var(--gol-color-syntax-num);
      }
      .studio-tok-punct {
        color: var(--gol-color-syntax-punct);
      }
      .studio-tok-lit {
        color: var(--gol-color-syntax-lit);
      }
      .studio-tok-match {
        outline: 1px solid var(--gol-color-accent);
        background: var(--gol-color-surface);
      }
      .studio-issue-list {
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: calc(var(--gol-space-6) * 4);
        overflow: auto;
        font-size: var(--gol-font-size-xs);
      }
      .studio-issue {
        display: flex;
        gap: var(--gol-space-2);
        color: var(--gol-color-danger-strong);
      }
      .studio-issue-line {
        flex: none;
        color: var(--gol-color-muted);
      }

      .dialog-panel-wide {
        width: min(90vw, calc(var(--gol-space-7) * 12));
      }
      .export-list {
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-3);
      }
      .export-row {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: var(--gol-space-1);
      }
      .export-hint {
        margin: 0;
        color: var(--gol-color-muted);
        font-size: var(--gol-font-size-sm);
      }

      /*
       * The shared dialog primitive (P1-D-5, `dialog.ts`) — every blocking prompt in the app
       * (a destructive-action confirmation, the ruleset picker's migration prompt) is built on
       * this. A portal (see `dialog.ts`'s own doc for why) with the same z-index-above-chrome
       * reasoning `.ruleset-popover`'s own note already covers.
       */
      .dialog-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--gol-color-scrim);
        z-index: 30;
      }
      .dialog-panel {
        width: min(90vw, 360px);
        max-height: 80vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
      }
      .dialog-panel:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .dialog-panel h3 {
        margin: 0;
      }
      .dialog-message {
        margin: 0;
        color: var(--gol-color-muted);
      }
      .dialog-controls {
        display: flex;
        gap: var(--gol-space-2);
      }
      .dialog-controls button {
        flex: 1;
        font: inherit;
        color: var(--gol-color-on-accent);
        background: var(--gol-color-accent);
        border: none;
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-2) var(--gol-space-3);
        cursor: pointer;
      }
      .dialog-controls button:hover {
        background: var(--gol-color-accent-strong);
      }
      .dialog-controls button:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .dialog-controls button.dialog-destructive {
        background: var(--gol-color-danger);
      }
      .dialog-controls button.dialog-destructive:hover {
        background: var(--gol-color-danger-strong);
      }

      /* The shared toast primitive (P1-D-5, `toast.ts`) — a portal, stacked bottom-centre, above
       * the transport dock. */
      .toast-region {
        position: fixed;
        left: 50%;
        bottom: calc(var(--gol-space-3) + 25vh);
        transform: translateX(-50%);
        display: flex;
        flex-direction: column-reverse;
        gap: var(--gol-space-2);
        align-items: center;
        z-index: 25;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: var(--gol-space-2);
        padding: var(--gol-space-2) var(--gol-space-3);
        max-width: min(90vw, 420px);
      }
      .toast-message {
        flex: 1;
      }
      .toast-dismiss {
        flex: none;
        font: inherit;
        line-height: 1;
        color: var(--gol-color-muted);
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0 var(--gol-space-1);
      }
      .toast-dismiss:hover {
        color: var(--gol-color-text);
      }
      .toast-dismiss:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }

      /*
       * Narrow-viewport reflow (phones, the 320px floor): `.chrome-status` moves out of the
       * bottom-right corner — at that width it would otherwise overlap `.chrome-transport`'s
       * centred dock — and stacks below it instead, both still bottom-anchored and centred.
       * `.chrome-panel-dock` needs no rule here: it renders nothing yet (`:empty` above keeps
       * it out of flow entirely). `.ruleset-popover` anchors to the viewport instead of the
       * toggle button so a 340px popover never overflows a 320px screen.
       */
      @media (max-width: 600px) {
        .ruleset-popover {
          left: var(--gol-space-3);
          right: var(--gol-space-3);
          top: auto;
          bottom: calc(100% + var(--gol-space-2));
          transform: none;
          width: auto;
        }
        #chrome-transport {
          bottom: calc(var(--gol-space-3) + 3.6em);
        }
        #chrome-status {
          left: 50%;
          right: auto;
          bottom: var(--gol-space-3);
          transform: translateX(-50%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="chrome">
        <div class="chrome-region chrome-toolbar" id="chrome-toolbar" role="toolbar" aria-label="Tools"></div>
        <!-- Populated by ui/components/transport.ts and ui/components/speed.ts (P1-D-2); empty
             until then, and `:empty { display: none }` above keeps that state visually inert. -->
        <div class="chrome-region chrome-transport" id="chrome-transport"></div>
        <!-- Populated by ui/components/statusbar.ts (P1-D-3); empty until then. -->
        <div class="chrome-region chrome-status" id="chrome-status"></div>
        <div class="chrome-region chrome-panel-dock" id="chrome-panel-dock" aria-label="Panels"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
