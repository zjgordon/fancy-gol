<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fancy-gol</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070a;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
      }
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        margin: 12px;
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #d7f5e8;
        background: rgba(5, 8, 11, 0.72);
        border: 1px solid rgba(124, 249, 208, 0.25);
        border-radius: 8px;
        backdrop-filter: blur(4px);
        user-select: none;
      }
      #hud .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
      }
      #hud .row .label {
        color: #7ba396;
      }
      #hud .controls {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      #hud button {
        flex: 1;
        font: inherit;
        color: #05070a;
        background: #7cf9d0;
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #hud button:hover {
        background: #9dfbdd;
      }
      #hud button:active {
        background: #5ed6ae;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="hud">
        <div class="row"><span class="label">tick</span><span id="stat-tick">0</span></div>
        <div class="row"><span class="label">population</span><span id="stat-population">0</span></div>
        <div class="row"><span class="label">fps</span><span id="stat-fps">0</span></div>
        <div class="row"><span class="label">step</span><span id="stat-step-ms">0.0 ms</span></div>
        <div class="row"><span class="label">render</span><span id="stat-render-ms">0.0 ms</span></div>
        <div class="controls">
          <button id="btn-play-pause" type="button">Pause</button>
          <button id="btn-reset" type="button">Reset</button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
