<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>fancy-gol</title>
    <link rel="icon" href="data:," />
    <style>
      /*
       * P1-D-1's interim design tokens. `src/themes/` (P1-E-1) does not exist yet, so these live
       * here for now, scoped to exactly what the shell chrome consumes — not the full ADR-008
       * token contract (colour ramps, 6 type sizes, shadow scale, …), which is P1-E-1's own job
       * to enumerate. Every rule below this block reads a `var(--gol-*)`, never a literal colour
       * or size, so migrating these definitions into `src/themes/tokens.css` + the Default theme
       * module is a pure relocation with no consumer changes — the same "provisional now, real
       * token slots in with no API change" treatment `ui/overlay/grid-lines.ts`'s `FadeCurve` and
       * `ui/tools/select.ts`'s `marchPeriodMs` already got.
       */
      :root {
        color-scheme: dark;
        --gol-color-bg: #05070a;
        --gol-color-surface: rgba(5, 8, 11, 0.72);
        --gol-color-elevated: rgba(10, 15, 19, 0.85);
        --gol-color-border: rgba(124, 249, 208, 0.25);
        --gol-color-text: #d7f5e8;
        --gol-color-muted: #7ba396;
        --gol-color-accent: #7cf9d0;
        --gol-color-accent-strong: #9dfbdd;
        --gol-color-accent-pressed: #5ed6ae;
        --gol-color-on-accent: #05070a;
        --gol-color-scrim: rgba(0, 0, 0, 0.5);
        --gol-color-danger: #ff6b6b;
        --gol-color-danger-strong: #ff8a8a;

        --gol-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --gol-font-size-sm: 13px;
        --gol-font-weight-regular: 400;
        --gol-font-weight-medium: 600;

        --gol-space-1: 4px;
        --gol-space-2: 8px;
        --gol-space-3: 12px;
        --gol-space-4: 16px;

        --gol-radius-sm: 6px;
        --gol-radius-md: 8px;

        --gol-shadow-chrome: 0 8px 24px rgba(0, 0, 0, 0.35);
        --gol-blur-chrome: blur(4px);

        /* Motion durations: provisional literals pending P1-E-1's real 4-duration scale. */
        --gol-duration-fast: 150ms;
        --gol-duration-slow: 600ms;
        --gol-ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1);

        /* Set per-region by `ui/components/shell.ts`'s `playIntro`; 0 the rest of the time. */
        --gol-intro-delay: 0ms;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--gol-color-bg);
      }

      /* The cascade's `origin` beats specificity: an author rule that sets `display` on a
       * `[hidden]` element (e.g. `.chrome-panel { display: flex }`) always wins over the UA
       * stylesheet's own `[hidden] { display: none }`, no matter how low its specificity —
       * caught live in a browser (P1-D-4's ruleset picker and migration dialog, both toggled via
       * the `hidden` property, rendered permanently open). This is the standard, narrow fix:
       * guarantee `hidden` always wins, for every element in this document, forever. */
      [hidden] {
        display: none !important;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      /* Scoped to the scene canvas specifically, not every `<canvas>` on the page — P1-D-4 added
       * 14 more (the ruleset picker's thumbnails), and a blanket `canvas { position: fixed;
       * inset: 0 }` rule pulled every one of them out of its flex layout and stretched it to
       * fill the viewport, caught live in a browser (`ruleset-picker.spec.ts`'s jsdom tests never
       * render real layout, so this had no way to fail there). */
      #scene {
        position: fixed;
        inset: 0;
        display: block;
      }

      /*
       * The chrome layer: full-viewport but pointer-transparent, so empty space between the
       * floating panels never steals a click/drag meant for the canvas underneath. Each region
       * re-enables pointer events for itself once it actually has content — `:empty` keeps an
       * unpopulated region (toolbar/panel-dock today; every future D-workstream task mounts into
       * one of these) invisible and inert instead of an awkward blank chip.
       */
      #chrome {
        position: fixed;
        inset: 0;
        pointer-events: none;
        transition: opacity var(--gol-duration-fast) var(--gol-ease-standard);
      }

      #chrome.chrome-hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Belt-and-braces: a region under an opacity-0 ancestor is still hit-testable by default
       * in some engines' accessibility trees; explicitly disabling pointer events on every region
       * too is what actually guarantees "canvas is never blocked by hidden chrome". */
      #chrome.chrome-hidden .chrome-region {
        pointer-events: none;
      }

      .chrome-region {
        position: absolute;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
        font: var(--gol-font-weight-regular) var(--gol-font-size-sm) / 1.4 var(--gol-font-mono);
        color: var(--gol-color-text);
        opacity: 1;
        transition:
          opacity var(--gol-duration-slow) var(--gol-ease-standard),
          transform var(--gol-duration-slow) var(--gol-ease-standard);
        transition-delay: var(--gol-intro-delay);
      }

      .chrome-region:empty {
        display: none;
      }

      #chrome.chrome-intro #chrome-toolbar,
      #chrome.chrome-intro #chrome-transport,
      #chrome.chrome-intro #chrome-status,
      #chrome.chrome-intro #chrome-panel-dock {
        opacity: 0;
        transform: translateY(6px);
      }
      #chrome.chrome-intro:not(.chrome-hidden) #chrome-toolbar,
      #chrome.chrome-intro:not(.chrome-hidden) #chrome-transport,
      #chrome.chrome-intro:not(.chrome-hidden) #chrome-status,
      #chrome.chrome-intro:not(.chrome-hidden) #chrome-panel-dock {
        opacity: 1;
        transform: translateY(0);
      }

      .chrome-panel {
        padding: var(--gol-space-2) var(--gol-space-3);
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
        background: var(--gol-color-surface);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-md);
        box-shadow: var(--gol-shadow-chrome);
        -webkit-backdrop-filter: var(--gol-blur-chrome);
        backdrop-filter: var(--gol-blur-chrome);
        user-select: none;
      }

      /* Solid fallback where `backdrop-filter` isn't supported (per-task requirement). */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .chrome-panel {
          background: var(--gol-color-elevated);
        }
      }

      #chrome-toolbar {
        left: var(--gol-space-3);
        top: 50%;
        transform: translateY(-50%);
      }
      #chrome.chrome-intro #chrome-toolbar {
        transform: translateY(calc(-50% + 6px));
      }
      #chrome.chrome-intro:not(.chrome-hidden) #chrome-toolbar {
        transform: translateY(-50%);
      }

      #chrome-transport {
        left: 50%;
        bottom: var(--gol-space-3);
        transform: translateX(-50%);
        align-items: center;
      }

      #chrome-status {
        right: var(--gol-space-3);
        bottom: var(--gol-space-3);
      }

      #chrome-panel-dock {
        right: 0;
        top: 0;
        bottom: 0;
        width: auto;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: var(--gol-space-4);
        font-variant-numeric: tabular-nums;
      }
      .row .label {
        color: var(--gol-color-muted);
      }

      .controls {
        display: flex;
        gap: var(--gol-space-2);
      }
      .controls button {
        flex: 1;
        font: inherit;
        color: var(--gol-color-on-accent);
        background: var(--gol-color-accent);
        border: none;
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-2) var(--gol-space-3);
        cursor: pointer;
      }
      .controls button:hover {
        background: var(--gol-color-accent-strong);
      }
      .controls button:active {
        background: var(--gol-color-accent-pressed);
      }
      .controls button:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .controls button:disabled {
        background: var(--gol-color-elevated);
        color: var(--gol-color-muted);
        cursor: not-allowed;
      }
      .controls button[aria-pressed='true'] {
        background: var(--gol-color-accent-pressed);
      }

      /*
       * The speed control (P1-D-2): a logarithmic slider plus an "unbounded" toggle, stacked
       * under the transport buttons in the same `.chrome-panel`-shaped `#chrome-transport` mount
       * point. `accent-color` is a one-line, zero-JS way to recolour the *native* range/checkbox
       * rendering from a token — the cheap end of "Stay Fancy", not a bespoke slider skin.
       */
      .speed-control {
        min-width: 220px;
      }
      .speed-readout {
        font-variant-numeric: tabular-nums;
      }
      .speed-slider-row {
        display: flex;
        align-items: center;
        gap: var(--gol-space-2);
      }
      .speed-slider {
        flex: 1;
        accent-color: var(--gol-color-accent);
      }
      .speed-slider:disabled {
        accent-color: var(--gol-color-muted);
        opacity: 0.5;
      }
      .speed-unbounded {
        font: inherit;
        color: var(--gol-color-text);
        background: transparent;
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-1) var(--gol-space-2);
        cursor: pointer;
        line-height: 1;
      }
      .speed-unbounded:hover {
        border-color: var(--gol-color-accent);
      }
      .speed-unbounded[aria-pressed='true'] {
        background: var(--gol-color-accent);
        color: var(--gol-color-on-accent);
        border-color: var(--gol-color-accent);
      }
      .speed-unbounded:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }

      /*
       * The status bar (P1-D-3). `.status-value` reserves a minimum column width so a digit
       * count changing (population climbing from 9 to 10, say) doesn't nudge the label beside it
       * — "no layout shift as digit counts change" — `.row` already sets tabular-nums for every
       * digit's own width to match; this is the column-width half of that guarantee.
       */
      .status-bar {
        min-width: 200px;
      }
      .status-value {
        display: inline-block;
        min-width: 7ch;
        text-align: right;
      }
      .status-chips {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gol-space-1);
      }
      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: var(--gol-space-1);
        padding: 0 var(--gol-space-1);
        border-radius: var(--gol-radius-sm);
        border: 1px solid var(--gol-color-border);
      }
      .status-chip-swatch {
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        background: var(--gol-chip-color, var(--gol-color-muted));
        flex: none;
      }
      .status-chip-name {
        color: var(--gol-color-muted);
      }
      .status-chip .status-value {
        min-width: 2ch;
      }

      /*
       * The ruleset picker (P1-D-4): a toolbar toggle button opening a popover listbox, plus
       * (P1-D-5) a migration dialog for an incompatible palette switch, built on the shared
       * `.dialog-*` classes below. `.ruleset-popover` gets an explicit z-index because it's a
       * descendant of the *first* chrome region in DOM order (`#chrome-toolbar`) and must still
       * paint above the later regions (transport, status, panel dock) that would otherwise stack
       * on top per plain DOM order.
       */
      .ruleset-picker {
        position: relative;
      }
      .ruleset-toggle {
        font: inherit;
        color: var(--gol-color-text);
        background: var(--gol-color-surface);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-2) var(--gol-space-3);
        cursor: pointer;
        white-space: nowrap;
      }
      .ruleset-toggle:hover {
        border-color: var(--gol-color-accent);
      }
      .ruleset-toggle:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .ruleset-toggle-name {
        font-weight: var(--gol-font-weight-medium);
      }
      .ruleset-popover {
        position: absolute;
        left: calc(100% + var(--gol-space-2));
        top: 50%;
        transform: translateY(-50%);
        width: 340px;
        max-height: min(70vh, 520px);
        overflow-y: auto;
        z-index: 20;
        padding: var(--gol-space-2);
      }
      .ruleset-listbox:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: -2px;
      }
      .ruleset-group-title {
        margin: var(--gol-space-2) 0 var(--gol-space-1);
        font-size: var(--gol-font-size-sm);
        font-weight: var(--gol-font-weight-medium);
        color: var(--gol-color-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .ruleset-group:first-child .ruleset-group-title {
        margin-top: 0;
      }
      .ruleset-entry {
        display: flex;
        align-items: center;
        gap: var(--gol-space-2);
        padding: var(--gol-space-1) var(--gol-space-2);
        border-radius: var(--gol-radius-sm);
        cursor: pointer;
      }
      .ruleset-entry:hover,
      .ruleset-entry--highlighted {
        background: var(--gol-color-elevated);
      }
      .ruleset-entry[aria-selected='true'] {
        outline: 1px solid var(--gol-color-accent);
      }
      .ruleset-thumb {
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: var(--gol-radius-sm);
        background: var(--gol-color-bg);
      }
      .ruleset-entry-info {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .ruleset-entry-name {
        font-weight: var(--gol-font-weight-medium);
      }
      .ruleset-entry-meta {
        font-size: var(--gol-font-size-sm);
        color: var(--gol-color-muted);
      }
      .ruleset-entry-desc {
        font-size: var(--gol-font-size-sm);
        color: var(--gol-color-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ruleset-migration-hint {
        margin: 0;
        color: var(--gol-color-muted);
        font-size: var(--gol-font-size-sm);
      }
      .ruleset-migration-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--gol-space-2);
      }
      .ruleset-migration-row select {
        font: inherit;
        color: var(--gol-color-text);
        background: var(--gol-color-elevated);
        border: 1px solid var(--gol-color-border);
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-1) var(--gol-space-2);
      }

      /*
       * The shared dialog primitive (P1-D-5, `dialog.ts`) — every blocking prompt in the app
       * (a destructive-action confirmation, the ruleset picker's migration prompt) is built on
       * this. A portal (see `dialog.ts`'s own doc for why) with the same z-index-above-chrome
       * reasoning `.ruleset-popover`'s own note already covers.
       */
      .dialog-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--gol-color-scrim);
        z-index: 30;
      }
      .dialog-panel {
        width: min(90vw, 360px);
        max-height: 80vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: var(--gol-space-2);
      }
      .dialog-panel:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .dialog-panel h3 {
        margin: 0;
      }
      .dialog-message {
        margin: 0;
        color: var(--gol-color-muted);
      }
      .dialog-controls {
        display: flex;
        gap: var(--gol-space-2);
      }
      .dialog-controls button {
        flex: 1;
        font: inherit;
        color: var(--gol-color-on-accent);
        background: var(--gol-color-accent);
        border: none;
        border-radius: var(--gol-radius-sm);
        padding: var(--gol-space-2) var(--gol-space-3);
        cursor: pointer;
      }
      .dialog-controls button:hover {
        background: var(--gol-color-accent-strong);
      }
      .dialog-controls button:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }
      .dialog-controls button.dialog-destructive {
        background: var(--gol-color-danger);
      }
      .dialog-controls button.dialog-destructive:hover {
        background: var(--gol-color-danger-strong);
      }

      /* The shared toast primitive (P1-D-5, `toast.ts`) — a portal, stacked bottom-centre, above
       * the transport dock. */
      .toast-region {
        position: fixed;
        left: 50%;
        bottom: calc(var(--gol-space-3) + 25vh);
        transform: translateX(-50%);
        display: flex;
        flex-direction: column-reverse;
        gap: var(--gol-space-2);
        align-items: center;
        z-index: 25;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: var(--gol-space-2);
        padding: var(--gol-space-2) var(--gol-space-3);
        max-width: min(90vw, 420px);
      }
      .toast-message {
        flex: 1;
      }
      .toast-dismiss {
        flex: none;
        font: inherit;
        line-height: 1;
        color: var(--gol-color-muted);
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0 var(--gol-space-1);
      }
      .toast-dismiss:hover {
        color: var(--gol-color-text);
      }
      .toast-dismiss:focus-visible {
        outline: 2px solid var(--gol-color-accent);
        outline-offset: 2px;
      }

      /*
       * Narrow-viewport reflow (phones, the 320px floor): `.chrome-status` moves out of the
       * bottom-right corner — at that width it would otherwise overlap `.chrome-transport`'s
       * centred dock — and stacks below it instead, both still bottom-anchored and centred.
       * `.chrome-panel-dock` needs no rule here: it renders nothing yet (`:empty` above keeps
       * it out of flow entirely). `.ruleset-popover` anchors to the viewport instead of the
       * toggle button so a 340px popover never overflows a 320px screen.
       */
      @media (max-width: 600px) {
        .ruleset-popover {
          left: var(--gol-space-3);
          right: var(--gol-space-3);
          top: auto;
          bottom: calc(100% + var(--gol-space-2));
          transform: none;
          width: auto;
        }
        #chrome-transport {
          bottom: calc(var(--gol-space-3) + 3.6em);
        }
        #chrome-status {
          left: 50%;
          right: auto;
          bottom: var(--gol-space-3);
          transform: translateX(-50%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="chrome">
        <div class="chrome-region chrome-toolbar" id="chrome-toolbar" role="toolbar" aria-label="Tools"></div>
        <!-- Populated by ui/components/transport.ts and ui/components/speed.ts (P1-D-2); empty
             until then, and `:empty { display: none }` above keeps that state visually inert. -->
        <div class="chrome-region chrome-transport" id="chrome-transport"></div>
        <!-- Populated by ui/components/statusbar.ts (P1-D-3); empty until then. -->
        <div class="chrome-region chrome-status" id="chrome-status"></div>
        <div class="chrome-region chrome-panel-dock" id="chrome-panel-dock" aria-label="Panels"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
