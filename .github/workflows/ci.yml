name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .nvmrc (current LTS). "Previous" covers package.json's engines floor.
  NODE_CURRENT: '22'
  NODE_PREVIOUS: '20'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # Node 20 is still our engines floor; GHA is deprecating the Node 20 action runtime.
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run boundaries

      - run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node${{ matrix.node }}
          path: coverage/
          retention-days: 14

      - name: Check dashboard is up to date
        if: matrix.node == env.NODE_CURRENT
        run: node .agents/scripts/build-dashboard.mjs --check

  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

  bench:
    name: bench
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm

      - run: npm ci

      # Compares against the committed bench-baseline.json; fails on a missed
      # absolute budget or a >10% regression, printing a before/after table.
      - run: npm run bench

      - name: Upload bench baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench-baseline.json
          retention-days: 14

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f docker/Dockerfile -t fancy-gol:ci .

      - name: Run container
        run: docker run -d --name fancy-gol-ci -p 8080:8080 fancy-gol:ci

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' fancy-gol-ci)"
            if [ "$status" = "healthy" ]; then
              echo "container is healthy"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "container reported unhealthy"
              docker logs fancy-gol-ci
              exit 1
            fi
            sleep 2
          done
          echo "timed out waiting for a healthy container"
          docker logs fancy-gol-ci
          exit 1

      - name: Probe /api/health
        run: curl --fail --silent --show-error http://localhost:8080/api/health

      - name: Container logs
        if: always()
        run: docker logs fancy-gol-ci

      - name: Stop container
        if: always()
        run: docker rm -f fancy-gol-ci

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run build

      - name: Run functional e2e (Chromium, Firefox, WebKit)
        run: npx playwright test --project=chromium --project=firefox --project=webkit
        env:
          E2E_SKIP_BUILD: '1'
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 14

  visual:
    name: visual (playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm

      - run: npm ci

      - name: Install screenshot fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Run visual regression (Chromium only)
        run: npx playwright test --project=visual
        env:
          E2E_SKIP_BUILD: '1'
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 14
