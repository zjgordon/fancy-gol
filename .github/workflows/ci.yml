name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .nvmrc (current LTS). "Previous" covers package.json's engines floor.
  NODE_CURRENT: '22'
  NODE_PREVIOUS: '20'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # Node 20 is still our engines floor; GHA is deprecating the Node 20 action runtime.
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run boundaries

      - run: npm run coverage

      # P3-E-8 — wall-clock budgets (preview cost, textRain, status bar, charts, thumbnails) are
      # skipped under coverage, where V8 instrumentation inflates src/ 2-10x, and run here
      # uncovered. Each is gated on a same-process calibration (tests/support/timing.ts): the
      # budget is the number in the test on a reference-speed machine and scales up, never down,
      # on a slower runner — the same philosophy as the bench harness's calibration ratio.
      - name: Wall-clock budgets (uncovered, calibrated)
        run: npm run test:timing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node${{ matrix.node }}
          path: coverage/
          retention-days: 14

      - name: Check dashboard is up to date
        if: matrix.node == env.NODE_CURRENT
        run: node .agents/scripts/build-dashboard.mjs --check

  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

  bench:
    name: bench
    runs-on: ubuntu-latest
    needs: verify
    # Non-blocking for one remaining reason: `client-js-gzip` is 135.7 kB against the 120 kB floor
    # until P3-E-7 splits the themes into lazy chunks. (The Node theme-cost cases that used to fail
    # here were removed by P3-E-8 — theme cost is now certified in `browser-floor` /
    # `browser-bench`, see planning/README.md §3.6.) Remove this line when P3-E-7 lands; do not
    # lower the budget to make the job green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm

      - run: npm ci

      # client-js-gzip reads dist/client/assets — build before measuring.
      - run: npm run build

      # Three-class gate (planning/README.md §3.6 / P2-F-1): deterministic ≤3%,
      # wall-clock on the calibration ratio, browser absolute-budget only.
      - run: npm run bench

      - name: Upload bench baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench-baseline.json
          retention-days: 14

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f docker/Dockerfile -t fancy-gol:ci .

      - name: Run container
        run: docker run -d --name fancy-gol-ci -p 8080:8080 fancy-gol:ci

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' fancy-gol-ci)"
            if [ "$status" = "healthy" ]; then
              echo "container is healthy"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "container reported unhealthy"
              docker logs fancy-gol-ci
              exit 1
            fi
            sleep 2
          done
          echo "timed out waiting for a healthy container"
          docker logs fancy-gol-ci
          exit 1

      - name: Probe /api/health
        run: curl --fail --silent --show-error http://localhost:8080/api/health

      - name: Container logs
        if: always()
        run: docker logs fancy-gol-ci

      - name: Stop container
        if: always()
        run: docker rm -f fancy-gol-ci

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run build

      - name: Run functional e2e (Chromium, Firefox, WebKit)
        run: npx playwright test --project=chromium --project=firefox --project=webkit
        env:
          E2E_SKIP_BUILD: '1'
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 14

  a11y:
    name: a11y (playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Run theme accessibility audit (Chromium)
        run: npx playwright test --project=a11y
        env:
          E2E_SKIP_BUILD: '1'
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  visual:
    name: visual (playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm

      - run: npm ci

      - name: Install screenshot fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Run visual regression (Chromium only)
        run: npx playwright test --project=visual
        env:
          E2E_SKIP_BUILD: '1'
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  browser-floor:
    name: browser-floor (playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      # P3-E-1 — the blocking tier of the two-tier theme frame gate (planning/README.md §3.6, D6):
      # effect liveness, per-frame allocation, and a same-runner ratio against Default. Every
      # assertion is relative, so a headless software-raster runner is a valid host. The absolute
      # >= 55 fps lives in the nightly `browser-bench`. One worker: the checks measure frame time.
      - name: Run theme effect-liveness and cost floor (Chromium only)
        run: npx playwright test --project=browser-floor --workers=1
        env:
          E2E_SKIP_BUILD: '1'
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browser-floor
          path: |
            playwright-report/
            test-results/
          retention-days: 14
