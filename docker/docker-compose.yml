name: fancy-gol

services:
  app:
    image: fancy-gol:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
    restart: unless-stopped
    volumes:
      # ADR-002: "file-backed JSON on a mounted volume" — sessions, user rulesets, and
      # user-saved patterns (P2-B-4) all live under this same directory.
      - data:/app/data

volumes:
  data:
